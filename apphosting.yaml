# Firebase App Hosting — backend do site Vineon (www.vineonsite.com.br)
#
# O App Hosting compila a partir do GitHub, nao da maquina local: ele roda
# `npm ci` e `npm run build` (= `ng build`, configuracao `production`) e publica
# o resultado. Como este app Angular nao tem SSR, o adaptador gera um servidor
# Express minimo que serve `www/browser` e devolve `index.html` em qualquer rota
# desconhecida — e isso que faz o deep link (/produto/123) funcionar no F5.
#
# Segredo NENHUM aqui: tudo que entra no bundle Angular e publico. Chave de
# gateway, token de webhook e afins continuam no `functions/.env`, usados so
# pelas Cloud Functions.

# Servidor proprio em vez do gerado pelo adaptador Angular: alem de servir o
# build com fallback de SPA, o server.mjs faz proxy de /__/auth/* para
# compraki-mcu.firebaseapp.com, o que deixa o login do Google rodar no
# dominio www.vineonsite.com.br (authDomain em environment.prod.ts).
# Sem dependencia npm: o container so precisa de www/ e do server.mjs.
scripts:
  buildCommand: npm run build
  runCommand: node server.mjs

outputFiles:
  serverApp:
    include: [www, server.mjs]

runConfig:
  # Servidor de arquivo estatico: o minimo ja sobra. A maior parte das
  # requisicoes nem chega aqui, o CDN do App Hosting responde antes.
  cpu: 1
  memoryMiB: 512
  concurrency: 80

  # Teto de containers. Alem de proteger a fatura, este numero esbarra numa
  # cota do projeto: o Cloud Run soma maxInstances x cpu de TODOS os servicos
  # da regiao, e as ~47 Cloud Functions (cada uma e um servico Cloud Run, todas
  # com maxInstances 10) ja reservam perto de 470 vCPU em us-central1. Com 10
  # aqui o rollout morre com "Quota exceeded for total allowable CPU per
  # project per region".
  #
  # 2 instancias x 80 requisicoes simultaneas = 160 em paralelo, e o CDN
  # responde a maior parte do trafego antes de chegar aqui. Para subir isto,
  # baixe o MAX_INSTANCES das functions ou peca aumento de cota.
  maxInstances: 2

  # Zero = nao paga container parado, mas a primeira visita depois de um tempo
  # ocioso espera o cold start (~1s). Se quiser o site sempre quente, troque
  # para 1 — custa da ordem de US$ 10-15/mes.
  minInstances: 0

env:
  # O puppeteer e devDependency (so a pasta automation/ usa, na maquina do
  # dev), mas o build do App Hosting instala devDependencies para ter o
  # Angular CLI — entao o postinstall dele baixaria um Chromium de ~150 MB
  # que ninguem vai usar. Isto desliga o download.
  - variable: PUPPETEER_SKIP_DOWNLOAD
    value: "1"
    availability:
      - BUILD
