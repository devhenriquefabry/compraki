<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Vineon</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <!-- Zoom do usuario liberado. Bloquea-lo reprova em WCAG 1.4.4 e a Play
       Store sinaliza; o Ionic lida bem com zoom. Nao reintroduzir os
       atributos de bloqueio de escala aqui. -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Google Sign-In Meta Tag -->
  <meta name="google-signin-client_id" content="2028715763-p879a7gv1u0u3in5n0t5k3f87r5i7sib.apps.googleusercontent.com">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
  <meta name="theme-color" content="#0B1623" />

  <!-- Abertura (uma vez por sessão): a página fica azul-noite e a logo já
       começa a se desenhar aqui, antes do Angular carregar. O .vn-boot fica
       FORA do <app-root> para o Angular não substituí-lo: a app-vineon-splash
       só conta o tempo a partir de window.__vnBootT e faz o fade deste mesmo
       elemento. Assim não há troca de logo (era o que dava a "piscadinha").
       O app tira a classe vn-booting quando a splash some. -->
  <script>try{if(!sessionStorage.getItem('compraki_splash_done'))document.documentElement.className+=' vn-booting'}catch(e){}</script>
  <style>
    html.vn-booting,html.vn-booting body{background:#0B1623}
    .vn-boot{display:none}
    html.vn-booting .vn-boot{display:flex;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;background:#0B1623;transition:opacity .45s ease}
    .vn-boot.vn-leaving{opacity:0;pointer-events:none}
    .vn-boot svg{display:block;width:250px;height:77px;overflow:visible}
    /* O traço "se desenha" com stroke-dasharray/dashoffset em unidades reais
       (comprimentos medidos de cada path, gravados no SVG). Nada de pathLength
       nem var(): o Safari não escala o tracejado pelo pathLength e mostrava a
       logo inteira e parada. Atraso/duração de cada traço vão no style dele. */
    .vn-boot .d{animation:vn-draw .8s cubic-bezier(.65,0,.25,1) forwards}
    .vn-boot .m{animation:vn-draw .6s ease-out .75s forwards}
    .vn-boot .f{opacity:0;animation:vn-fade .4s ease 1.25s forwards}
    @keyframes vn-draw{to{stroke-dashoffset:0}}
    @keyframes vn-fade{to{opacity:1}}
  </style>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  
</head>

<body>

n-delay:1.55s" cx="175.7" cy="77.5" r="5.2" fill="#D8F51F"/><g fill="none" stroke="#D8F51F" stroke-width="8" stroke-linejoin="round"><path stroke-dasharray="41 81" stroke-dashoffset="61" style="animation-duration:.6s;animation-delay:1.0s" class="d" d="M175.7 91.5V131"/><path stroke-dasharray="121 161" stroke-dashoffset="141" style="animation-duration:.6s;animation-delay:1.1s" class="d" d="M194.2 131V110A18.5 18.5 0 0 1 212.7 91.5H232.5A18.5 18.5 0 0 1 251 110V131"/><path stroke-dasharray="211 251" stroke-dashoffset="231" style="animation-duration:.6s;animation-delay:1.2s" class="d" d="M270.4 111H327.1V110A18.5 18.5 0 0 0 308.6 91.5H288.9A18.5 18.5 0 0 0 270.4 110V112.5A18.5 18.5 0 0 0 288.9 131H331.5"/><path stroke-dasharray="162 202" stroke-dashoffset="182" style="animation-duration:.6s;animation-delay:1.3s" class="d" stroke-linecap="round" d="M348.5 110A18.5 18.5 0 0 1 367 91.5H386.8A18.5 18.5 0 0 1 405.3 110V112.5A18.5 18.5 0 0 1 386.8 131H367A18.5 18.5 0 0 1 348.5 112.5Z"/><path stroke-dasharray="121 161" stroke-dashoffset="141" style="animation-duration:.6s;animation-delay:1.4s" class="d" d="M426.7 131V110A18.5 18.5 0 0 1 445.2 91.5H465A18.5 18.5 0 0 1 483.5 110V131"/></g></svg></div>
  <script>window.__vnBootT=performance.now()</script>
  <app-root></app-root>
</body>

</html>
