<ion-tabs>

  <ion-tab-bar slot="bottom" class="vn-tabbar">
    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <svg class="vn-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.home" /></svg>
      <span class="vn-tab-label">Início</span>
    </ion-tab-button>

    <ion-tab-button tab="upload-product" href="/tabs/upload-product">
      <svg class="vn-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.plus" /></svg>
      <span class="vn-tab-label">Anunciar</span>
    </ion-tab-button>

    <ion-tab-button tab="cart" href="/tabs/cart">
      <span class="vn-tab-cart">
        <svg class="vn-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.cart" /></svg>
        @if (cartCount() > 0) {
          <span class="vn-tab-badge">{{ cartCount() > 99 ? '99+' : cartCount() }}</span>
        }
      </span>
      <span class="vn-tab-label">Carrinho</span>
    </ion-tab-button>

    <ion-tab-button
      tab="my-account"
      href="/tabs/my-account"
      [attr.aria-label]="unread() > 0 ? 'Conta, ' + unread() + (unread() === 1 ? ' aviso novo' : ' avisos novos') : null"
    >
      <span class="vn-tab-cart">
        <svg class="vn-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.account" /></svg>
        @if (unread() > 0) { <span class="vn-tab-dot" aria-hidden="true"></span> }
      </span>
      <span class="vn-tab-label">Conta</span>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
